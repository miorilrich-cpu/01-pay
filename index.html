<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yoneko Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#fff5f9;
    --pink:#ff75a0;
    --pink-light:#ffe3ed;
    --pink-hover:#ff5c93;
    --brown:#6e4731;
    --card-bg:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Mitr',sans-serif;
    background:
    radial-gradient(circle,#ffecf4 2px,transparent 2px);
    background-size:28px 28px;
    background-color:var(--bg);
    color:var(--brown);
    padding:35px 20px 70px;
}

.container{
    max-width:420px;
    margin:auto;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 40px;
    padding: 25px 20px;
    box-shadow: 0 15px 35px rgba(255, 117, 160, 0.12);
    border: 2px solid #fff;
}

.title{
    text-align:center;
    color:var(--pink);
    font-size:30px;
    font-weight:600;
    margin-bottom:20px;
    text-shadow: 0 2px 8px rgba(255, 117, 160, 0.25);
    letter-spacing: 1px;
}

/* QR FRAME */

.qr-frame{
    background:#fff;
    border:2px dashed var(--pink);
    border-radius:34px;
    padding:12px;
    box-shadow:0 10px 25px rgba(255,117,160,.1);
    transition: transform 0.3s ease;
}

.qr-frame:hover {
    transform: translateY(-3px);
}

.qr-inner{
    border:1px solid var(--pink-light);
    border-radius:26px;
    overflow:hidden;
    padding:10px;
    background: #fff9fc;
}

.qr-inner img{
    width:100%;
    display:block;
    border-radius:18px;
}

/* PLAYER */

.player{
    text-align:center;
    margin-top:20px;
    background: var(--pink-light);
    padding: 15px;
    border-radius: 24px;
}

.time{
    font-size:14px;
    margin-bottom:12px;
    color:var(--brown);
    font-weight: 500;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    margin-top:8px;
}

.player-btn{
    width:42px;
    height:42px;
    border:none;
    background:#fff;
    border-radius: 50%;
    cursor:pointer;
    color:var(--pink);
    box-shadow: 0 4px 10px rgba(255, 117, 160, 0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.2s ease;
}

.player-btn:hover {
    background: var(--pink);
    color: #fff;
    transform: scale(1.08);
}

.player-btn svg{
    width:20px;
    height:20px;
    fill:currentColor;
}

.section{
    margin-top:24px;
}

.line{
    width:100%;
    height:1.5px;
    background:var(--pink-light);
    margin-bottom:16px;
    border-radius: 99px;
}

.label{
    color:var(--pink);
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:8px;
    font-weight: 600;
}

.center-label{
    text-align:center;
}

.center-value{
    text-align:center;
    font-size:22px;
    font-weight:600;
    color: var(--brown);
}
.value{
    font-size:16px;
    font-weight: 500;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background: #fff;
    padding: 8px 12px 8px 16px;
    border-radius: 16px;
    border: 1px solid var(--pink-light);
}

.copy-btn{
    border:none;
    background:var(--pink-light);
    color:var(--pink);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Mitr',sans-serif;
    font-weight: 500;
    transition: all 0.2s ease;
}

.copy-btn:hover {
    background: var(--pink);
    color: #fff;
}

.small-note{
    margin-top:8px;
    font-size:12px;
    opacity:.8;
}

.center{
    text-align:center;
}

.footer{
    text-align:center;
    margin-top:25px;
}

.footer h3{
    color:var(--pink);
    font-weight:500;
    font-size:18px;
    text-shadow: 0 2px 6px rgba(255, 117, 160, 0.2);
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:var(--pink);
    color:white;
    padding:10px 22px;
    border-radius:999px;
    opacity:0;
    transition:.3s;
    pointer-events:none;
    box-shadow: 0 5px 15px rgba(255, 117, 160, 0.4);
    font-weight: 500;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(-5px);
}

</style>
</head>
<body>

<div class="container">

<div class="title">
    ♡ Yoneko Payment ♡
</div>

<div class="qr-frame">

    <div class="qr-inner">

        <img src="https://via.placeholder.com/800x800.png?text=QR+CODE"
        alt="QR Code">

    </div>

</div>

<div class="player">

    <div class="time">
        2:57 ───────♡─────── 5:20
    </div>

    <div class="controls">

        <button class="player-btn" type="button">

            <svg viewBox="0 0 24 24">
                <path d="M11 6v12L2.5 12 11 6zm10 0v12L12.5 12 21 6z"/>
            </svg>

        </button>

        <button class="player-btn" type="button">

            <svg viewBox="0 0 24 24">
                <rect x="5" y="4" width="5" height="16"/>
                <rect x="14" y="4" width="5" height="16"/>
            </svg>

        </button>

        <button class="player-btn" type="button">

            <svg viewBox="0 0 24 24">
                <path d="M13 6v12l8.5-6L13 6zM3 6v12l8.5-6L3 6z"/>
            </svg>

        </button>

    </div>

</div>

<div class="section">

    <div class="line"></div>

    <div class="label center-label">
        ♡ ACCOUNT NAME ♡
    </div>

    <div class="center-value">
        Yoneko Store
    </div>

</div>

<div class="section">

    <div class="line"></div>

    <div class="label">
        BANK ACCOUNT
    </div>

    <div class="row">

        <div class="value">
            123-4-56789-0
        </div>

        <button class="copy-btn"
        onclick="copyText('123-4-56789-0')">
            คัดลอก
        </button>

    </div>

</div>
<div class="section">

    <div class="line"></div>

    <div class="label">
        TRUE WALLET
    </div>

    <div class="row">

        <div class="value">
            080-123-4567
        </div>

        <button class="copy-btn"
        onclick="copyText('080-123-4567')">
            คัดลอก
        </button>

    </div>

</div>

<div class="section">

    <div class="line"></div>

    <div class="label">
        NOTE
    </div>

    <div class="row">

        <div class="value">
            โอนเงินให้ยัยมิ
        </div>

        <button class="copy-btn"
        onclick="copyText('โอนเงินให้ยัยมิ')">
            คัดลอก
        </button>

    </div>

    <div class="small-note">
        * ลูกค้าใหม่ลืมโน๊ตปรับ 5 บาท
    </div>

</div>

<div class="section">

    <div class="line"></div>

    <div class="small-note center">
        หมายเหตุ: เช็คชื่อบัญชีทุกครั้งก่อนทำรายการ
    </div>

</div>

<div class="section">
    <div class="line"></div>
</div>

<div class="footer">

    <h3>
        Thank you for your order ♡
    </h3>

</div>

</div>

<div id="toast" class="toast">
    คัดลอกแล้ว ♡
</div>

<script>

function copyText(text){

    navigator.clipboard.writeText(text);

    const toast = document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1500);

}

</script>

</body>
</html>
